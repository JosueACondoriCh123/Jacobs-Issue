<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b131e"/>
      <stop offset="70%" stop-color="#05080d"/>
      <stop offset="100%" stop-color="#020406"/>
    </radialGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#00ff88"/>
    </linearGradient>
    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb020"/>
      <stop offset="100%" stop-color="#ff1e56"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="100" cy="100" r="92" fill="url(#bgGrad)" stroke="#1a2736" stroke-width="2.5"/>
  <circle cx="100" cy="100" r="85" fill="none" stroke="#00f0ff" stroke-width="0.8" stroke-dasharray="4 6" opacity="0.4"/>
  <circle cx="100" cy="100" r="68" fill="none" stroke="#162230" stroke-width="1.5"/>
  <circle cx="100" cy="100" r="48" fill="none" stroke="#00ff88" stroke-width="1" stroke-dasharray="3 5" opacity="0.5"/>
  <circle cx="100" cy="100" r="28" fill="none" stroke="#1f3044" stroke-width="1.2"/>

  <!-- Compass Crosshairs -->
  <line x1="100" y1="12" x2="100" y2="30" stroke="#00f0ff" stroke-width="2" stroke-linecap="round"/>
  <line x1="100" y1="170" x2="100" y2="188" stroke="#1f3044" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="100" x2="30" y2="100" stroke="#1f3044" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="100" x2="188" y2="100" stroke="#1f3044" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Acoustic Arc Wavefronts (Sound Localization) -->
  <path d="M 52,65 A 60 60 0 0 1 148,65" fill="none" stroke="url(#cyanGlow)" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M 65,78 A 42 42 0 0 1 135,78" fill="none" stroke="url(#cyanGlow)" stroke-width="2.2" stroke-linecap="round" opacity="0.8"/>
  <path d="M 78,89 A 24 24 0 0 1 122,89" fill="none" stroke="url(#cyanGlow)" stroke-width="1.8" stroke-linecap="round" opacity="0.6"/>

  <!-- Sound Vector Direction Needle -->
  <polygon points="100,24 95,100 105,100" fill="url(#amberGlow)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="6" fill="#05080d" stroke="#00f0ff" stroke-width="2"/>
  <circle cx="100" cy="100" r="2.5" fill="#00ff88"/>

  <!-- Decorative HUD Tick Marks -->
  <circle cx="100" cy="18" r="2" fill="#00f0ff"/>
  <circle cx="182" cy="100" r="1.5" fill="#6b7c8f"/>
  <circle cx="100" cy="182" r="1.5" fill="#6b7c8f"/>
  <circle cx="18" cy="100" r="1.5" fill="#6b7c8f"/>
</svg>
